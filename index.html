<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        /* --- GLOBAL STYLES --- */
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            transition: background-color 0.3s;
            background-color: #000; /* Default background */
        }

        /* Top Bar for FPS and Settings */
        .top-bar {
            display: flex;
            justify-content: space-between;
            width: 320px;
            align-items: center;
            margin-bottom: 30px; /* Gives space so it doesn't squish */
        }

        #fps-counter {
            font-weight: bold;
            font-size: 16px;
            color: #0ff;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: monospace;
        }

        select {
            padding: 5px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            max-width: 220px;
        }

        /* Base Calculator Grid */
        .calculator {
            width: 320px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            transition: all 0.3s;
        }

        #display {
            grid-column: 1 / -1;
            text-align: right;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
        }

        button {
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
        }

        .btn-zero {
            grid-column: span 2;
        }

        /* ---------------------------------------------------
           THEME 1: NORMAL (iPhone Style - Default)
           --------------------------------------------------- */
        body.theme-normal { background-color: #000; font-family: -apple-system, sans-serif; }
        body.theme-normal .calculator { gap: 12px; padding: 12px; }
        body.theme-normal #display { background: #000; color: #fff; font-size: 70px; font-weight: 300; min-height: 80px; padding: 20px 10px; }
        body.theme-normal #display.sassy-mode { color: #ff4757; font-size: 32px; padding-bottom: 30px;}
        body.theme-normal button { aspect-ratio: 1; border-radius: 50%; font-size: 32px; transition: opacity 0.1s; }
        body.theme-normal button:active { opacity: 0.7; }
        body.theme-normal .btn-zero { aspect-ratio: auto; border-radius: 40px; justify-content: flex-start; padding-left: 30px; }
        body.theme-normal .btn-light-gray { background-color: #a5a5a5; color: #000; }
        body.theme-normal .btn-dark-gray { background-color: #333; color: #fff; }
        body.theme-normal .btn-orange { background-color: #ff9f0a; color: #fff; font-size: 38px; }

        /* ---------------------------------------------------
           THEME 2: LOW (The Original Red/Grey Box)
           --------------------------------------------------- */
        body.theme-low { background-color: #222; font-family: Arial, sans-serif; }
        body.theme-low .calculator { background-color: #333; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); gap: 10px; }
        body.theme-low #display { background-color: #222; color: #1dd1a1; font-size: 40px; font-weight: bold; min-height: 60px; padding: 10px; border-radius: 5px; }
        body.theme-low #display.sassy-mode { color: #ff4757; font-size: 24px; }
